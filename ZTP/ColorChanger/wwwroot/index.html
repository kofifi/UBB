<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Odcienie szarości</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 20px auto; padding: 0 16px; background: #f4f4f5; color: #18181b; }
    .panel { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
    .images { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .images div { background: #fff; border-radius: 10px; padding: 12px; }
    canvas { width: 100%; height: auto; display: block; background: #e4e4e7; }
    button { padding: 8px 16px; font-size: 15px; cursor: pointer; }
    #result { font-weight: 600; }
  </style>
</head>
<body>
  <h1>Zamiana zdjęcia na odcienie szarości</h1>

  <div class="panel">
    <label>Zdjęcie: <input type="file" id="file" accept="image/*"></label>
    <label>Szerokość:
      <select id="width">
        <option>512</option>
        <option selected>1024</option>
        <option>2048</option>
        <option>4096</option>
        <option>8192</option>
      </select> px
    </label>
    <label>Powtórzenia: <input type="number" id="repeat" value="1" min="1" max="1000" style="width: 70px"></label>
    <label><input type="checkbox" id="keep"> trzymaj wyniki w pamięci</label>
    <button id="run">Przetwórz</button>
    <button id="clear">Wyczyść pamięć</button>
  </div>

  <div class="panel" id="result">Wybierz zdjęcie (albo użyj domyślnego) i kliknij „Przetwórz”.</div>

  <div class="images">
    <div>Oryginał<canvas id="src"></canvas></div>
    <div>Wynik<canvas id="dst"></canvas></div>
  </div>

<script>
const src = document.getElementById('src');
const dst = document.getElementById('dst');
const result = document.getElementById('result');
let image = null;

function defaultImage() {
  const c = document.createElement('canvas');
  c.width = 800; c.height = 600;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 800, 600);
  ['red', 'orange', 'yellow', 'green', 'blue', 'violet'].forEach((col, i) => grad.addColorStop(i / 5, col));
  g.fillStyle = grad;
  g.fillRect(0, 0, 800, 600);
  return c;
}

function drawSource() {
  const img = image ?? defaultImage();
  const w = +document.getElementById('width').value;
  src.width = w;
  src.height = Math.round(w * img.height / img.width);
  src.getContext('2d').drawImage(img, 0, 0, src.width, src.height);
}

document.getElementById('file').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => { image = img; drawSource(); };
  img.src = URL.createObjectURL(file);
});
document.getElementById('width').addEventListener('change', drawSource);

document.getElementById('run').addEventListener('click', async () => {
  const pixels = src.getContext('2d').getImageData(0, 0, src.width, src.height);
  const repeat = document.getElementById('repeat').value;
  const keep = document.getElementById('keep').checked;
  result.textContent = 'Przetwarzanie...';

  const res = await fetch(`/api/grayscale?repeat=${repeat}&keep=${keep}`, { method: 'POST', body: pixels.data });
  const data = new Uint8ClampedArray(await res.arrayBuffer());

  dst.width = src.width;
  dst.height = src.height;
  dst.getContext('2d').putImageData(new ImageData(data, src.width, src.height), 0, 0);

  const mb = (pixels.data.length / 1024 / 1024).toFixed(1);
  result.textContent = `Obraz ${src.width}×${src.height} (${mb} MB), powtórzeń: ${repeat}, czas: ${res.headers.get('X-Elapsed-Ms')} ms, wyników w pamięci: ${res.headers.get('X-Kept-Count')}`;
});

document.getElementById('clear').addEventListener('click', async () => {
  await fetch('/api/clear', { method: 'POST' });
  result.textContent = 'Wyniki usunięte z pamięci (zostaną zwolnione przy najbliższym GC).';
});

drawSource();
</script>
</body>
</html>
